name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

jobs:
  lint:
    name: L0 — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/
      - run: mypy app/

  test-unit:
    name: L1 — unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install fastapi httpx pytest pytest-asyncio pytest-cov
      - run: pytest tests/unit/ --cov=app --cov-report=term-missing --cov-fail-under=70

  build-push:
    name: Build + push image
    if: |
      (github.ref_name == 'main' || github.ref_name == 'dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag and gitops overlay
        id: tag
        run: |
          SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "sha=dev-${SHA}"      >> "$GITHUB_OUTPUT"
            echo "overlay=dev"         >> "$GITHUB_OUTPUT"
          else
            echo "sha=${SHA}"          >> "$GITHUB_OUTPUT"
            echo "overlay=prod"        >> "$GITHUB_OUTPUT"
          fi

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/harbor.10.0.0.200.nip.io
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /etc/docker/certs.d/harbor.10.0.0.200.nip.io/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - uses: docker/login-action@v3
        with:
          registry: harbor.10.0.0.200.nip.io
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: harbor.10.0.0.200.nip.io/library/minicloud-crew-agent:${{ steps.tag.outputs.sha }}

      - name: Install cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            harbor.10.0.0.200.nip.io/library/minicloud-crew-agent:${{ steps.tag.outputs.sha }}@${{ steps.build.outputs.digest }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.6.0"

      - name: Import GPG key for signed gitops commit
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Update gitops overlay via PR
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git config --global user.name 'AndreLiar'
          git config --global user.email 'andrelaurelyvan.kanmegnetabouguie@ynov.com'
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/andrelair-platform/minicloud-gitops.git /tmp/gitops
          cd /tmp/gitops
          BRANCH="gitops/minicloud-crew-agent-${{ steps.tag.outputs.sha }}"
          git checkout -b "$BRANCH"
          cd services/minicloud-crew-agent/minicloud-1/${{ steps.tag.outputs.overlay }}
          kustomize edit set image harbor.10.0.0.200.nip.io/library/minicloud-crew-agent:${{ steps.tag.outputs.sha }}
          git add kustomization.yaml
          git commit -S -m "chore(minicloud-crew-agent): bump ${{ steps.tag.outputs.overlay }} image to ${{ steps.tag.outputs.sha }}"
          git push origin "$BRANCH"
          gh pr create \
            --repo andrelair-platform/minicloud-gitops \
            --title "chore(minicloud-crew-agent): bump ${{ steps.tag.outputs.overlay }} image to ${{ steps.tag.outputs.sha }}" \
            --body "Automated image bump from CI." \
            --base main \
            --head "$BRANCH"
          sleep 5
          gh pr merge "$BRANCH" \
            --repo andrelair-platform/minicloud-gitops \
            --merge \
            --delete-branch
