name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: L0 — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/
      - run: mypy app/

  test-unit:
    name: L1 — unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install fastapi httpx pytest pytest-asyncio pytest-cov
      - run: pytest tests/unit/ --cov=app --cov-report=term-missing --cov-fail-under=70

  build-push:
    name: Build + push image
    if: |
      (github.ref_name == 'main' || github.ref_name == 'dev') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      packages: write          # push prod images to ghcr.io (Internal)
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag and gitops overlay
        id: tag
        run: |
          SHA=$(git rev-parse --short HEAD)
          GHCR=ghcr.io/andrelair-platform/minicloud-crew-agent
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "sha=dev-${SHA}"      >> "$GITHUB_OUTPUT"
            echo "overlay=dev"         >> "$GITHUB_OUTPUT"
            TAGS="${GHCR}:dev-${SHA}"
          else
            echo "sha=${SHA}"          >> "$GITHUB_OUTPUT"
            echo "overlay=prod"        >> "$GITHUB_OUTPUT"
            TAGS="${GHCR}:${SHA}"
          fi
          { echo "tags<<EOF"; echo "${TAGS}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.tags }}

      - name: Install cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Sign ghcr image
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            ghcr.io/andrelair-platform/minicloud-crew-agent@${{ steps.build.outputs.digest }}

      # ── Promotion + dev verification handled by KARGO, not CI ──────────────
      # Build ends at a verified, immutable artifact (dual-push Harbor + ghcr, cosign, SBOM).
      # Kargo auto-promotes the main Freight to the dev Stage + runs dev verification
      # (services/minicloud-crew-agent/kargo/analysis-dev-smoke.yaml, Variant C); prod is a manual
      # CODEOWNERS-gated Kargo promotion. No CI gitops bump.
